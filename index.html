<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woordenboek van het Asses</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Importeer de 'Old Style' krantenfonten */
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Sans+Pro:wght@400;600&display=swap');

        :root {
            --paper: #f9f7f2; /* De kleur van krantenpapier */
            --ink: #121212;   /* Bijna zwart, maar zachter */
            --border: #2f2f2f; /* Voor de scheidingslijnen */
        }

        body { 
            background-color: var(--paper); 
            color: var(--ink); 
            font-family: 'Libre Baskerville', serif;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Krantenkop */
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            letter-spacing: -1.5px;
            font-weight: 900;
            border-bottom: 5px double var(--ink);
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .header-top-border {
            border-top: 1px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            padding: 5px 0;
            margin-bottom: 2rem;
            font-family: 'Source Sans Pro', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .sticky-header {
            background-color: rgba(249, 247, 242, 0.95);
            border-bottom: 2px solid var(--ink);
            z-index: 100;
        }

        /* De zoekbalk: Minimalistisch & Klassiek */
        #searchInput {
            background-color: transparent !important;
            border: none !important;
            border-bottom: 2px solid var(--ink) !important;
            border-radius: 0 !important;
            font-family: 'Libre Baskerville', serif;
            font-style: italic;
            color: var(--ink) !important;
            padding: 10px 0;
            outline: none;
        }

        /* Geen zwarte kaders meer, maar subtiele krantenlijnen */
        .word-card {
            border-bottom: 1px solid #d1d1d1;
            padding: 2.5rem 0;
            background: transparent !important;
            box-shadow: none !important;
        }

        .word-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.75rem;
            color: var(--ink);
        }

        .description-text {
            line-height: 1.7;
            font-size: 1.15rem;
            color: #333;
            max-width: 70ch;
        }

        /* Highlighting zoals een subtiele marker op papier */
        mark {
            background-color: #fdf2a8;
            color: inherit;
            padding: 0 2px;
            border-radius: 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--paper); }
        ::-webkit-scrollbar-thumb { background: #ccc; }

        /* Verwijder de schakelaar styling en maak het sober */
        .switch-label {
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }
    </style>
</head>
<body>

    <header class="max-w-4xl mx-auto pt-16 pb-4 text-center">
        <h1>Woordenboek van het Asses</h1>
        <div class="header-top-border">
            <span>Editie Asse — <script>document.write(new Date().toLocaleDateString('nl-BE', {day:'numeric', month:'long', year:'numeric'}));</script></span>
        </div>
    </header>

    <div class="sticky top-0 sticky-header py-6 mb-8">
        <div class="max-w-3xl mx-auto px-4">
            <input type="text" id="searchInput" 
                placeholder="Zoek in het archief..." 
                class="w-full text-2xl">
            
            <div class="mt-3 flex justify-between items-center">
                <div id="status" class="text-[10px] text-gray-600 uppercase tracking-widest">
                    Archief wordt geladen...
                </div>
                <div class="flex items-center gap-3">
                    <span class="switch-label">Markeren</span>
                    <input type="checkbox" id="highlightToggle" checked class="accent-black">
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 flex-grow">
        <div id="results" class="space-y-0">
            </div>
    </main>

    <footer class="w-full py-12 mt-20 border-t-4 border-double border-black text-center">
        <p class="font-serif italic text-gray-700">
            Opgesteld door Lode Pletinckx
        </p>
        <p class="text-[10px] uppercase tracking-[0.2em] mt-2 text-gray-500">
            © Alle rechten voorbehouden — De Gazet van Asse
        </p>
    </footer>

    <script>
        // ... (De rest van je JavaScript blijft hetzelfde, maar vervang de renderResults functie) ...
        let fuse;
        let lastResults = [];
        const resultsDiv = document.getElementById('results');
        const searchInput = document.getElementById('searchInput');
        const statusDiv = document.getElementById('status');
        const highlightToggle = document.getElementById('highlightToggle');

        const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        function applyHighlight(html, term) {
            if (!term || !highlightToggle.checked) return html;
            const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedTerm})(?![^<]*>)`, 'gi');
            return html.replace(regex, '<mark>$1</mark>');
        }

        // DE AANGEPASTE RENDER FUNCTIE VOOR DE KLASSIEKE LOOK
        function renderResults(results, query) {
            if (results.length === 0) {
                resultsDiv.innerHTML = `<div class="text-center py-20 italic text-gray-500">Geen vermeldingen gevonden voor "${query}".</div>`;
                return;
            }

            resultsDiv.innerHTML = results.slice(0, 100).map(result => {
                const wordContent = result.item.worddisplay || result.item.word;
                const descContent = result.item.descriptiondisplay || result.item.description;

                return `
                <article class="word-card">
                    <h2 class="word-title">${applyHighlight(wordContent, query)}</h2>
                    <div class="description-text">${applyHighlight(descContent, query)}</div>
                </article>
            `}).join('');
        }

        // URL en Fetch logica (ongewijzigd)
        function performSearch(query) {
            if (query.length < 2) {
                resultsDiv.innerHTML = '<p class="text-center py-20 italic text-gray-400">Voer een zoekterm in om het archief te raadplegen.</p>';
                statusDiv.innerText = "";
                return;
            }
            lastResults = fuse.search(query);
            lastResults.sort((a, b) => {
                const aWord = a.item.word.toLowerCase();
                const bWord = b.item.word.toLowerCase();
                const q = query.toLowerCase();
                const qNorm = normalize(q);
                const aExact = aWord === q || normalize(aWord) === qNorm;
                const bExact = bWord === q || normalize(bWord) === qNorm;
                if (aExact && !bExact) return -1;
                if (!aExact && bExact) return 1;
                return a.score - b.score;
            });
            renderResults(lastResults, query);
            statusDiv.innerText = `${lastResults.length} resultaten gevonden`;
        }

        fetch('words.json')
            .then(response => response.json())
            .then(data => {
                fuse = new Fuse(data, {
                    keys: [{ name: 'word', weight: 2 }, { name: 'description', weight: 0.5 }],
                    threshold: 0.3,
                    includeScore: true,
                    getFn: (obj, key) => normalize(obj[key])
                });
                statusDiv.innerText = `${data.length.toLocaleString('nl-NL')} woorden in archief`;
                const params = new URLSearchParams(window.location.search);
                if (params.get('q')) {
                    searchInput.value = params.get('q');
                    performSearch(params.get('q'));
                }
            });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            performSearch(query);
            const url = new URL(window.location);
            query ? url.searchParams.set('q', query) : url.searchParams.delete('q');
            window.history.replaceState({}, '', url);
        });

        highlightToggle.addEventListener('change', () => {
            if (searchInput.value.trim().length >= 2) renderResults(lastResults, searchInput.value.trim());
        });
    </script>
</body>
</html>
